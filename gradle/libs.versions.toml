[versions]
kotlin = "2.4.21"
kover = "0.9.11"
binaryCompatibilityValidator = "0.18.2"
mavenPublish = "0.37.0"
# jqwik 1.10.x is built against JUnit Platform 1.14.x, so stay on the matching Jupiter 5.14.x line.
junit = "5.14.4"
jqwik = "1.10.2"
spotless = "8.10.4"
ktlint = "1.8.0"
# 1.37.0 (2026-10-01) fails on JDK 21 with an InvocationTargetException; 1.36.1 is the newest that works.
googleJavaFormat = "1.36.1"
# Newest stable detekt (Feb 2025). 2.0.0 is still alpha. It targets Kotlin 2.0 but analyses our sources fine.
detekt = "1.23.8"
dokka = "2.2.0"
animalsniffer = "2.0.1"
agp = "9.4.1"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
junit4 = "4.13.2"
# Android API 21 (5.0) signature: the oldest level the library is checked against.
androidSignature21 = "5.0.1_r2"

[libraries]
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
android-signature = { module = "net.sf.androidscents.signature:android-api-level-21", version.ref = "androidSignature21" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
android-library = { id = "com.android.library", version.ref = "agp" }
