name: Android

# Runs the library on real Android runtimes (ART) in an emulator. Slower than the JVM CI, so it only runs on
# changes that can affect Android, on demand, and weekly.
on:
  push:
    branches: [main, android-support]
    paths:
      - "core/**"
      - "android-tests/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "core/**"
      - "android-tests/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1" # Mondays

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    name: Animal Sniffer (Android API 21 signatures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :core:animalsnifferMain --no-daemon --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

  emulator:
    name: Instrumented tests on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [21, 24, 26, 30, 34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew -p android-tests connectedDebugAndroidTest --no-daemon --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports-api${{ matrix.api }}
          path: android-tests/build/reports/androidTests
          if-no-files-found: ignore
